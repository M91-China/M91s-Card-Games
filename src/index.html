<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a6e3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%230a6e3e'/><text x='96' y='130' font-size='100' text-anchor='middle'>🃏</text></svg>" />
  <title>HappyCard - 欢乐斗地主 & 掼蛋</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/hall.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div id="app">
    <div class="hall-container">
      <header class="hall-header">
        <div class="player-info">
          <div class="player-avatar" id="playerAvatar">😎</div>
          <div class="player-detail">
            <div class="player-name" id="playerName">玩家</div>
            <div class="player-stats" id="playerStats">积分: 1000 | 胜率: --</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary btn-press" id="authBtn" title="登录/注册" style="padding:8px 12px; font-size:13px;">登录</button>
          <button class="icon-btn" id="statsBtn" title="数据统计">📊</button>
          <button class="icon-btn" id="replayBtn" title="对局回放">📹</button>
          <button class="icon-btn" id="achBtn" title="成就">🏅</button>
          <button class="icon-btn" id="themeBtn" title="切换主题">🎨</button>
          <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
        </div>
      </header>

      <div class="hall-title">
        <h1>HappyCard</h1>
        <div class="subtitle">欢 乐 斗 地 主 · 掼 蛋</div>
      </div>

      <main class="game-entries">
        <div class="game-card game-card-doudizhu" id="entryDoudizhu">
          <span class="game-card-tag hot">HOT</span>
          <div class="game-card-icon">🃏</div>
          <div class="game-card-title">斗地主</div>
          <div class="game-card-desc">三人对战 · 经典玩法<br>叫地主 · 抢地主 · 炸弹对决</div>
        </div>
        <div class="game-card game-card-guandan" id="entryGuandan">
          <span class="game-card-tag hot">NEW</span>
          <div class="game-card-icon">🎴</div>
          <div class="game-card-title">掼 蛋</div>
          <div class="game-card-desc">四人组队 · 对家配合<br>同花顺 · 天王炸 · 逢人配</div>
        </div>
        <div class="game-card game-card-challenge" id="entryChallenge">
          <span class="game-card-tag">挑战</span>
          <div class="game-card-icon">🏆</div>
          <div class="game-card-title">残局挑战</div>
          <div class="game-card-desc">破解经典残局<br>考验牌技与智慧</div>
        </div>
      </main>

      <div class="history-panel" id="historyPanel">
        <h3>最近战绩</h3>
        <div id="historyList">
          <div class="history-item">
            <span>暂无记录</span>
          </div>
        </div>
      </div>

      <footer class="hall-footer">
        HappyCard v0.6.0 · 斗地主 & 掼蛋 · 高级AI · 音效动画 · 战绩系统
      </footer>
    </div>
  </div>

  <script src="js/data/constants.js"></script>
  <script src="js/data/config.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/utils/utils.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/user/Storage.js"></script>
  <script src="js/user/UserManager.js"></script>
  <script src="js/utils/StatsManager.js"></script>
  <script src="js/utils/ReplayManager.js"></script>
  <script src="js/core/EventBus.js"></script>
  <script src="js/core/Card.js"></script>
  <script src="js/core/Deck.js"></script>
  <script src="js/core/Hand.js"></script>
  <script src="js/ui/Renderer.js"></script>
  <script src="js/ui/CardRenderer.js"></script>
  <script src="js/ui/Animation.js"></script>
  <script src="js/ui/SoundManager.js"></script>
  <script src="js/ui/UIManager.js"></script>

  <script>
    (function () {
      const storage = window.storage;
      const ui = window.uiManager;
      const sound = window.sound;
      const userManager = window.userManager || null;

      function getCurrentAuthUser() {
        return userManager ? userManager.getCurrentUser() : null;
      }

      function loadPlayerInfo() {
        const currentUser = getCurrentAuthUser();
        let info = storage.get('player_info');
        if (currentUser) {
          info = {
            name: currentUser.username,
            avatar: currentUser.avatar || '😎',
            coins: (info && info.coins) || 1000
          };
        } else if (!info) {
          info = { name: '游客', avatar: '😎', coins: 1000 };
        }
        document.getElementById('playerName').textContent = info.name;
        document.getElementById('playerAvatar').textContent = info.avatar || '😎';
        return info;
      }

      function loadStats() {
        const user = getCurrentAuthUser();
        let summary = user ? userManager.getCurrentStatsSummary() : window.statsManager.getSummary();
        if (user) {
          document.getElementById('playerStats').textContent =
            `账号: ${user.username} | 场次: ${summary.totalGames} | 胜率: ${summary.winRate} | 最高连胜: ${summary.maxStreak}`;
        } else {
          document.getElementById('playerStats').textContent =
            `积分: ${summary.score} | 胜率: ${summary.winRate} (${summary.wins}胜${summary.losses}负) | 🏅${summary.unlockedCount}/${summary.totalAchievements}`;
        }
      }

      function loadHistory() {
        const stats = window.statsManager.getStats();
        const dz = (stats.doudizhu && stats.doudizhu.history) || [];
        const gd = (stats.guandan && stats.guandan.history) || [];
        const all = []
          .concat(dz.map((h) => ({ ...h, game: '斗地主' })))
          .concat(gd.map((h) => ({ ...h, game: '掼蛋' })))
          .sort((a, b) => (a.time < b.time ? 1 : -1))
          .slice(0, 10);
        const list = document.getElementById('historyList');
        if (all.length === 0) {
          list.innerHTML = '<div class="history-item"><span>暂无记录</span></div>';
          return;
        }
        list.innerHTML = all
          .map(
            (h) => `
          <div class="history-item">
            <span>${h.game} · ${h.detail || ''}</span>
            <span class="history-result ${h.result === '胜' ? 'win' : 'lose'}">${h.result || ''}${h.score != null ? ' (' + (h.score > 0 ? '+' : '') + h.score + ')' : ''}</span>
          </div>`
          )
          .join('');
      }

      function openStats() {
        sound.playClick();
        const s = window.statsManager.getStats();
        const dz = s.doudizhu;
        const gd = s.guandan;
        const pct = (w, l) => {
          const t = w + l;
          return t > 0 ? ((w / t) * 100).toFixed(1) + '%' : '--';
        };
        const levelDisplay = (v) => {
          const map = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
          return map[v] || String(v);
        };
        const content = document.createElement('div');
        content.className = 'stats-panel';
        content.innerHTML = `
          <div class="stats-section">
            <h4>🃏 斗地主</h4>
            <div class="stats-grid">
              <div class="stat-cell"><span class="num">${dz.totalGames}</span><span class="lbl">总局数</span></div>
              <div class="stat-cell win"><span class="num">${dz.wins}</span><span class="lbl">胜利</span></div>
              <div class="stat-cell lose"><span class="num">${dz.losses}</span><span class="lbl">失败</span></div>
              <div class="stat-cell"><span class="num">${pct(dz.wins, dz.losses)}</span><span class="lbl">胜率</span></div>
              <div class="stat-cell"><span class="num">${dz.landlordWins}</span><span class="lbl">地主胜</span></div>
              <div class="stat-cell"><span class="num">${dz.farmerWins}</span><span class="lbl">农民胜</span></div>
              <div class="stat-cell"><span class="num">${dz.bombs}</span><span class="lbl">炸弹</span></div>
              <div class="stat-cell"><span class="num">${dz.rockets}</span><span class="lbl">王炸</span></div>
              <div class="stat-cell"><span class="num">×${dz.maxMultiplier}</span><span class="lbl">最高倍数</span></div>
              <div class="stat-cell"><span class="num">${dz.maxStreak}</span><span class="lbl">最高连胜</span></div>
            </div>
          </div>
          <div class="stats-section">
            <h4>🎴 掼蛋</h4>
            <div class="stats-grid">
              <div class="stat-cell"><span class="num">${gd.totalGames}</span><span class="lbl">总局数</span></div>
              <div class="stat-cell win"><span class="num">${gd.wins}</span><span class="lbl">胜利</span></div>
              <div class="stat-cell lose"><span class="num">${gd.losses}</span><span class="lbl">失败</span></div>
              <div class="stat-cell"><span class="num">${pct(gd.wins, gd.losses)}</span><span class="lbl">胜率</span></div>
              <div class="stat-cell"><span class="num">${gd.bombs}</span><span class="lbl">炸弹</span></div>
              <div class="stat-cell"><span class="num">${gd.straightFlushes}</span><span class="lbl">同花顺</span></div>
              <div class="stat-cell"><span class="num">${gd.skyBombs}</span><span class="lbl">天王炸</span></div>
              <div class="stat-cell"><span class="num">${levelDisplay(gd.maxLevel)}</span><span class="lbl">最高等级</span></div>
              <div class="stat-cell"><span class="num">${gd.maxStreak}</span><span class="lbl">最高连胜</span></div>
            </div>
          </div>
        `;
        const box = ui.modal({
          title: '📊 数据统计',
          content,
          buttons: [{ text: '关闭', type: 'gray' }]
        });
        box.querySelector('.btn-gray').onclick = () => {
          box.parentElement.classList.add('fade-out');
          setTimeout(() => box.parentElement.remove(), 250);
        };
      }

      function openAchievements() {
        sound.playClick();
        const states = window.statsManager.getAchievementStates();
        const categories = [
          { key: 'general', name: '综合成就', icon: '🌟' },
          { key: 'doudizhu', name: '斗地主', icon: '🃏' },
          { key: 'guandan', name: '掼蛋', icon: '🎴' }
        ];
        const content = document.createElement('div');
        content.className = 'ach-panel';
        let html = `<div class="ach-progress">已解锁 <b>${states.filter((a) => a.unlocked).length}</b> / ${states.length}</div>`;
        categories.forEach((cat) => {
          const list = states.filter((a) => a.category === cat.key);
          html += `<div class="ach-cat"><h4>${cat.icon} ${cat.name}</h4><div class="ach-grid">`;
          list.forEach((a) => {
            html += `<div class="ach-card ${a.unlocked ? 'unlocked' : 'locked'}">
              <div class="ach-card-icon">${a.icon}</div>
              <div class="ach-card-name">${a.name}</div>
              <div class="ach-card-desc">${a.desc}</div>
            </div>`;
          });
          html += '</div></div>';
        });
        content.innerHTML = html;
        const box = ui.modal({
          title: '🏅 成就',
          content,
          buttons: [{ text: '关闭', type: 'gray' }]
        });
        box.querySelector('.btn-gray').onclick = () => {
          box.parentElement.classList.add('fade-out');
          setTimeout(() => box.parentElement.remove(), 250);
        };
      }

      const THEMES = [
        { key: '', name: '经典绿', icon: '🟢' },
        { key: 'royal', name: '皇家紫', icon: '🟣' },
        { key: 'ocean', name: '海洋蓝', icon: '🔵' },
        { key: 'night', name: '暗夜黑', icon: '⚫' },
        { key: 'festive', name: '喜庆红', icon: '🔴' }
      ];

      function cycleTheme() {
        sound.playClick();
        const current = document.documentElement.getAttribute('data-theme') || '';
        const idx = THEMES.findIndex(t => t.key === current);
        const next = THEMES[(idx + 1) % THEMES.length];
        applyTheme(next.key);
        storage.set('theme', next.key);
        uiManager.toast(next.icon + ' 已切换为' + next.name, 1500);
      }

      function applyTheme(key) {
        if (key) {
          document.documentElement.setAttribute('data-theme', key);
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }

      // 启动时应用保存的主题
      (function initTheme() {
        const saved = storage.get('theme');
        if (saved) applyTheme(saved);
      })();

      function openSettings() {
        const settings = storage.get('settings') || {
          difficulty: 'normal',
          sound: true,
          animation: true,
          volume: 0.6
        };
        const content = document.createElement('div');
        content.innerHTML = `
          <div style="margin-bottom:8px;font-size:14px;">难度选择：</div>
          <div class="difficulty-options" id="diffOpts">
            ${['easy', 'normal', 'hard', 'hell']
              .map(
                (d) => `
              <div class="difficulty-opt ${settings.difficulty === d ? 'active' : ''}" data-d="${d}">
                <span class="diff-name">${{ easy: '简单', normal: '普通', hard: '困难', hell: '地狱' }[d]}</span>
                <span class="diff-desc">${{ easy: '新手友好', normal: '标准对局', hard: '需要技巧', hell: '极限挑战' }[d]}</span>
              </div>`
              )
              .join('')}
          </div>
          <div class="switch-row">
            <span>音效</span>
            <div class="switch ${settings.sound !== false ? 'on' : ''}" id="swSound"></div>
          </div>
          <div class="switch-row">
            <span>动画</span>
            <div class="switch ${settings.animation !== false ? 'on' : ''}" id="swAnim"></div>
          </div>
          <div class="switch-row">
            <span>音量</span>
            <input type="range" id="volRange" min="0" max="1" step="0.1" value="${settings.volume != null ? settings.volume : 0.6}" style="width:140px;">
          </div>
        `;
        const box = ui.modal({
          title: '游戏设置',
          content,
          buttons: [{ text: '保存', type: 'primary' }]
        });

        setTimeout(() => {
          const opts = content.querySelectorAll('#diffOpts .difficulty-opt');
          opts.forEach((o) => {
            o.addEventListener('click', () => {
              opts.forEach((x) => x.classList.remove('active'));
              o.classList.add('active');
              settings.difficulty = o.dataset.d;
            });
          });
          const swSound = content.querySelector('#swSound');
          swSound.addEventListener('click', () => {
            settings.sound = !settings.sound;
            swSound.classList.toggle('on', settings.sound);
          });
          const swAnim = content.querySelector('#swAnim');
          swAnim.addEventListener('click', () => {
            settings.animation = !settings.animation;
            swAnim.classList.toggle('on', settings.animation);
          });
        }, 0);

        const saveBtn = box.querySelector('.btn-primary');
        saveBtn.onclick = () => {
          const volEl = content.querySelector('#volRange');
          if (volEl) settings.volume = parseFloat(volEl.value);
          storage.set('settings', settings);
          sound.setEnabled(settings.sound !== false);
          if (sound.setVolume) sound.setVolume(settings.volume != null ? settings.volume : 0.6);
          ui.toast('设置已保存');
          box.parentElement.classList.add('fade-out');
          setTimeout(() => box.parentElement.remove(), 250);
        };
      }

      function renderAuthButton() {
        const btn = document.getElementById('authBtn');
        if (!btn) return;
        const user = getCurrentAuthUser();
        btn.textContent = user ? `已登录: ${user.username}` : '登录';
      }

      function openChangePasswordModal() {
        if (!userManager) {
          ui.toast('用户系统未初始化');
          return;
        }

        const content = document.createElement('div');
        content.className = 'auth-form';
        content.innerHTML = `
          <div class="auth-field">
            <label>旧密码</label>
            <input type="password" id="oldPasswordInput" maxlength="30" placeholder="请输入当前密码" />
          </div>
          <div class="auth-field">
            <label>新密码</label>
            <input type="password" id="newPasswordInput" maxlength="30" placeholder="请输入新密码（至少4位）" />
          </div>
          <div class="auth-field">
            <label>确认新密码</label>
            <input type="password" id="confirmPasswordInput" maxlength="30" placeholder="再次输入新密码" />
          </div>
        `;

        const modal = ui.modal({
          title: '修改密码',
          content,
          buttons: [
            { text: '提交', type: 'primary' },
            { text: '取消', type: 'gray' }
          ]
        });

        const submitBtn = modal.parentElement && modal.parentElement.querySelector ? modal.parentElement.querySelector('.btn-primary') : null;
        const cancelBtn = modal.parentElement && modal.parentElement.querySelector ? modal.parentElement.querySelector('.btn-gray') : null;

        if (submitBtn) {
          submitBtn.addEventListener('click', () => {
            const oldPassword = document.getElementById('oldPasswordInput').value;
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
              ui.toast('请填写完整密码信息');
              return;
            }
            if (newPassword !== confirmPassword) {
              ui.toast('两次新密码输入不一致');
              return;
            }
            try {
              userManager.changePassword(oldPassword, newPassword);
              ui.toast('密码修改成功');
              modal.parentElement.classList.add('fade-out');
              setTimeout(() => modal.parentElement.remove(), 250);
            } catch (err) {
              ui.toast(err.message || '修改失败');
            }
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            modal.parentElement.classList.add('fade-out');
            setTimeout(() => modal.parentElement.remove(), 250);
          });
        }
      }

      function openUserProfileModal() {
        const user = getCurrentAuthUser();
        if (!user) {
          openAuthModal();
          return;
        }

        const summary = userManager.getCurrentStatsSummary();
        const d = user.stats && user.stats.doudizhu ? user.stats.doudizhu : { totalGames: 0, wins: 0, losses: 0, winRate: 0, history: [], maxStreak: 0 };
        const g = user.stats && user.stats.guandan ? user.stats.guandan : { totalGames: 0, wins: 0, losses: 0, winRate: 0, history: [], maxStreak: 0 };
        const allHistory = []
          .concat((d.history || []).map((h) => ({ ...h, game: '斗地主' })))
          .concat((g.history || []).map((h) => ({ ...h, game: '掼蛋' })))
          .sort((a, b) => (a.time < b.time ? 1 : -1))
          .slice(0, 8);

        const content = document.createElement('div');
        content.className = 'user-profile-box';
        content.innerHTML = `
          <div class="user-profile-header">
            <div class="user-profile-avatar">${user.avatar || '😎'}</div>
            <div class="user-profile-meta">
              <div class="name">${user.username}</div>
              <div class="time">注册时间：${new Date(user.createTime || Date.now()).toLocaleDateString('zh-CN')}</div>
            </div>
          </div>
          <div class="user-profile-stats">
            <div class="user-stat"><span class="num">${summary.totalGames}</span><span class="label">总局数</span></div>
            <div class="user-stat"><span class="num">${summary.wins}</span><span class="label">胜场</span></div>
            <div class="user-stat"><span class="num">${summary.losses}</span><span class="label">败场</span></div>
            <div class="user-stat"><span class="num">${summary.winRate}</span><span class="label">胜率</span></div>
          </div>
          <div class="profile-actions">
            <button class="btn btn-primary btn-press" id="profileChangePassBtn">修改密码</button>
            <button class="btn btn-gray btn-press" id="profileLogoutBtn">退出登录</button>
          </div>
          <div class="auth-field">
            <label>最近战绩</label>
            <div class="user-history-list">
              ${allHistory.length ? allHistory.map((h) => `
                <div class="user-history-item">
                  <div>
                    <strong>${h.game}</strong><br>
                    <span>${h.detail || '对局'}</span>
                  </div>
                  <div class="res ${h.result === '胜' ? 'win' : 'lose'}">${h.result || '未结算'}</div>
                </div>
              `).join('') : '<div class="user-history-item"><span>暂无记录</span></div>'}
            </div>
          </div>
        `;

        const modal = ui.modal({
          title: '个人中心',
          content,
          buttons: [{ text: '关闭', type: 'gray' }]
        });

        const closeBtn = modal.parentElement && modal.parentElement.querySelector ? modal.parentElement.querySelector('.btn-gray') : null;
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            modal.parentElement.classList.add('fade-out');
            setTimeout(() => modal.parentElement.remove(), 250);
          });
        }

        const changePassBtn = content.querySelector('#profileChangePassBtn');
        if (changePassBtn) {
          changePassBtn.addEventListener('click', () => {
            modal.parentElement.classList.add('fade-out');
            setTimeout(() => modal.parentElement.remove(), 250);
            setTimeout(() => openChangePasswordModal(), 280);
          });
        }

        const logoutBtn = content.querySelector('#profileLogoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            modal.parentElement.classList.add('fade-out');
            setTimeout(() => modal.parentElement.remove(), 250);
            userManager.logout();
            loadPlayerInfo();
            loadStats();
            loadHistory();
            renderAuthButton();
            ui.toast('已退出登录');
          });
        }
      }

      function openAuthModal() {
        if (!userManager) {
          ui.toast('用户系统未初始化');
          return;
        }

        const state = { mode: 'login' };
        const wrapper = document.createElement('div');
        wrapper.className = 'auth-form';

        const tabs = document.createElement('div');
        tabs.className = 'auth-tabs';

        const loginTab = document.createElement('button');
        loginTab.type = 'button';
        loginTab.className = 'auth-tab active';
        loginTab.textContent = '登录';

        const registerTab = document.createElement('button');
        registerTab.type = 'button';
        registerTab.className = 'auth-tab';
        registerTab.textContent = '注册';

        const userField = document.createElement('div');
        userField.className = 'auth-field';
        userField.innerHTML = '<label>用户名</label><input type="text" id="authUser" maxlength="20" placeholder="请输入用户名" />';

        const passField = document.createElement('div');
        passField.className = 'auth-field';
        passField.innerHTML = '<label>密码</label><input type="password" id="authPass" maxlength="30" placeholder="请输入密码" />';

        const rememberWrap = document.createElement('div');
        rememberWrap.className = 'auth-check';
        rememberWrap.innerHTML = '<span>记住我（7天自动登录）</span><input type="checkbox" id="rememberMe" checked />';

        const actionRow = document.createElement('div');
        actionRow.className = 'auth-action-row';
        const submitBtn = document.createElement('button');
        submitBtn.className = 'btn btn-primary btn-press';
        submitBtn.textContent = '登录';
        const secondaryBtn = document.createElement('button');
        secondaryBtn.className = 'btn btn-gray btn-press';
        secondaryBtn.textContent = '取消';
        actionRow.appendChild(submitBtn);
        actionRow.appendChild(secondaryBtn);

        tabs.appendChild(loginTab);
        tabs.appendChild(registerTab);
        wrapper.appendChild(tabs);
        wrapper.appendChild(userField);
        wrapper.appendChild(passField);
        wrapper.appendChild(rememberWrap);
        wrapper.appendChild(actionRow);

        const modal = ui.modal({
          title: '登录 / 注册',
          content: wrapper,
          buttons: []
        });

        const switchMode = (nextMode) => {
          state.mode = nextMode;
          loginTab.classList.toggle('active', nextMode === 'login');
          registerTab.classList.toggle('active', nextMode === 'register');
          submitBtn.textContent = nextMode === 'login' ? '登录' : '注册';
        };

        loginTab.addEventListener('click', () => switchMode('login'));
        registerTab.addEventListener('click', () => switchMode('register'));

        submitBtn.addEventListener('click', () => {
          const username = document.getElementById('authUser').value.trim();
          const password = document.getElementById('authPass').value;
          const remember = document.getElementById('rememberMe').checked;

          if (!username || !password) {
            ui.toast('用户名和密码不能为空');
            return;
          }

          try {
            if (state.mode === 'register') {
              userManager.register(username, password);
              ui.toast('注册成功，已自动登录');
              userManager.login(username, password, remember);
            } else {
              userManager.login(username, password, remember);
              ui.toast('登录成功');
            }

            modal.parentElement.classList.add('fade-out');
            setTimeout(() => modal.parentElement.remove(), 250);
            loadPlayerInfo();
            loadStats();
            loadHistory();
            renderAuthButton();
          } catch (err) {
            ui.toast(err.message || '操作失败');
          }
        });

        secondaryBtn.addEventListener('click', () => {
          modal.parentElement.classList.add('fade-out');
          setTimeout(() => modal.parentElement.remove(), 250);
        });
      }

      function init() {
        const rememberedUser = userManager ? userManager.autoLogin() : null;
        if (rememberedUser) {
          ui.toast('已自动登录：' + rememberedUser.username, 1500);
        }

        loadPlayerInfo();
        loadStats();
        loadHistory();
        renderAuthButton();

        document.getElementById('entryDoudizhu').addEventListener('click', () => {
          sound.playClick();
          window.location.href = 'doudizhu.html';
        });
        document.getElementById('entryGuandan').addEventListener('click', () => {
          sound.playClick();
          window.location.href = 'guandan.html';
        });
        document.getElementById('entryChallenge').addEventListener('click', () => {
          sound.playClick();
          window.location.href = 'challenge.html';
        });
        document.getElementById('settingsBtn').addEventListener('click', () => {
          sound.playClick();
          openSettings();
        });
        document.getElementById('statsBtn').addEventListener('click', openStats);
        document.getElementById('replayBtn').addEventListener('click', () => {
          sound.playClick();
          window.location.href = 'replay.html';
        });
        document.getElementById('achBtn').addEventListener('click', openAchievements);
        document.getElementById('themeBtn').addEventListener('click', cycleTheme);
        document.getElementById('authBtn').addEventListener('click', () => {
          const currentUser = getCurrentAuthUser();
          if (currentUser) {
            openUserProfileModal();
            return;
          }
          openAuthModal();
        });

        const settings = storage.get('settings');
        if (settings) {
          sound.setEnabled(settings.sound !== false);
          if (sound.setVolume) sound.setVolume(settings.volume != null ? settings.volume : 0.6);
        }

        if (window.Utils.isDebug()) {
          console.log('%c[HappyCard] 调试模式', 'color:#0d8a4e;font-size:16px;font-weight:bold');
        }
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

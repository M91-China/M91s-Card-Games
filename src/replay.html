<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>对局回放 - HappyCard</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <script>
    (function(){try{var t=localStorage.getItem('happycard_theme');if(t){t=JSON.parse(t);if(t)document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
  </script>
  <style>
    body { background: var(--color-bg, #0f1729); color: #e8eaf0; font-family: 'Microsoft YaHei', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: rgba(0,0,0,0.3); }
    .topbar h1 { font-size: 18px; color: var(--color-gold, #ffd24a); margin: 0; }
    .topbar a { color: #7eb6ff; text-decoration: none; font-size: 14px; }
    .topbar a:hover { text-decoration: underline; }

    /* 回放列表 */
    .replay-list { max-width: 700px; margin: 40px auto; padding: 0 20px; width: 100%; }
    .replay-list h2 { color: #ffd24a; margin-bottom: 16px; }
    .replay-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
    .replay-item:hover { background: rgba(255,255,255,0.1); }
    .replay-item .info { flex: 1; }
    .replay-item .title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
    .replay-item .meta { font-size: 12px; color: rgba(255,255,255,0.5); }
    .replay-item .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge.ddz { background: rgba(76,175,80,0.2); color: #4caf50; }
    .badge.gd { background: rgba(126,182,255,0.2); color: #7eb6ff; }
    .replay-item .del { color: #ef5350; cursor: pointer; padding: 6px 10px; font-size: 18px; margin-left: 10px; }
    .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); }
    .empty .icon { font-size: 60px; margin-bottom: 12px; }

    /* 回放播放器 */
    .player { display: none; flex: 1; flex-direction: column; padding: 10px; position: relative; min-height: 0; }
    .player.active { display: flex; }

    .game-info { text-align: center; padding: 8px; font-size: 14px; color: rgba(255,255,255,0.7); }
    .game-info .type { color: #ffd24a; font-weight: bold; }

    .table-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 300px; }

    .seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .seat.top { top: 10px; left: 50%; transform: translateX(-50%); flex-direction: column; }
    .seat.left { left: 10px; top: 50%; transform: translateY(-50%); }
    .seat.right { right: 10px; top: 50%; transform: translateY(-50%); }
    .seat.bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }

    .seat-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid rgba(255,255,255,0.2); }
    .seat-name { font-size: 12px; color: rgba(255,255,255,0.7); }
    .seat-cards-count { font-size: 11px; color: #ffd24a; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px; }
    .seat.active-turn .seat-avatar { border-color: #ffd24a; box-shadow: 0 0 12px rgba(255,210,74,0.5); }
    .seat.winner .seat-avatar { border-color: #4caf50; }

    .played-cards { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; min-height: 50px; align-items: center; }
    .seat.top .played-cards { flex-direction: row; }
    .played-cards .card-mini { width: 36px; height: 50px; }

    .center-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .center-cards { display: flex; gap: 3px; }
    .center-cards .card-mini { width: 44px; height: 62px; }
    .play-label { font-size: 13px; color: #ffd24a; font-weight: bold; }

    .hand-area { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; padding: 8px; min-height: 70px; }
    .hand-area .card-mini { width: 40px; height: 56px; }

    .card-mini { background: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 1px solid rgba(0,0,0,0.1); position: relative; }
    .card-mini.red { color: #d32f2f; }
    .card-mini.black { color: #212121; }
    .card-mini.joker { font-size: 10px; writing-mode: vertical-rl; }
    .card-mini.back { background: linear-gradient(135deg, #1a4a8a, #2a6ab5); border-color: #1a4a8a; }
    .card-mini.back::after { content: '🂠'; color: rgba(255,255,255,0.3); font-size: 24px; }
    .card-mini.dim { opacity: 0.35; }

    /* 控制栏 */
    .controls { background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 12px; margin: 8px; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; position: relative; margin-bottom: 10px; }
    .progress-fill { height: 100%; background: var(--color-gold, #ffd24a); border-radius: 3px; transition: width 0.2s; }
    .progress-mark { position: absolute; top: -3px; width: 12px; height: 12px; background: #ffd24a; border-radius: 50%; transform: translateX(-50%); }
    .ctrl-btns { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .ctrl-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .ctrl-btn:hover { background: rgba(255,255,255,0.2); }
    .ctrl-btn.play { background: #0d8a4e; width: 52px; height: 52px; font-size: 22px; }
    .ctrl-btn.play:hover { background: #0f9b58; }
    .speed-select { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
    .step-info { font-size: 13px; color: rgba(255,255,255,0.6); min-width: 100px; text-align: center; }
    .event-label { text-align: center; font-size: 13px; color: #ffd24a; min-height: 20px; margin-bottom: 6px; }

    @media (max-width: 600px) {
      .seat-avatar { width: 36px; height: 36px; font-size: 20px; }
      .card-mini { width: 28px !important; height: 40px !important; font-size: 11px !important; }
      .center-cards .card-mini { width: 34px !important; height: 48px !important; }
      .hand-area .card-mini { width: 30px !important; height: 42px !important; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📹 对局回放</h1>
    <a href="index.html">← 返回大厅</a>
  </div>

  <!-- 回放列表 -->
  <div class="replay-list" id="replayList">
    <h2>历史回放</h2>
    <div id="listContent"></div>
  </div>

  <!-- 回放播放器 -->
  <div class="player" id="player">
    <div class="game-info">
      <span class="type" id="gameType"></span> · <span id="gameDate"></span>
    </div>
    <div class="table-area" id="tableArea">
      <!-- Seats rendered by JS -->
    </div>
    <div class="event-label" id="eventLabel"></div>
    <div class="hand-area" id="handArea"></div>
    <div class="controls">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="ctrl-btns">
        <button class="ctrl-btn" id="prevBtn" title="上一步">⏮</button>
        <button class="ctrl-btn play" id="playBtn" title="播放/暂停">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="下一步">⏭</button>
        <select class="speed-select" id="speedSelect">
          <option value="2000">0.5x</option>
          <option value="1000" selected>1x</option>
          <option value="500">2x</option>
          <option value="200">5x</option>
        </select>
        <span class="step-info" id="stepInfo">0 / 0</span>
      </div>
    </div>
  </div>

  <script src="js/data/constants.js"></script>
  <script src="js/core/Card.js"></script>
  <script src="js/core/Hand.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/ReplayManager.js"></script>
  <script>
    class ReplayPlayer {
      constructor() {
        this.replay = null;
        this.stepIndex = -1;
        this.playing = false;
        this.timer = null;
        this.hands = [];
        this.playedCards = [[], [], [], []];
        this.currentEvent = null;

        this.urlParams = new URLSearchParams(window.location.search);
        const replayId = this.urlParams.get('id');
        if (replayId) {
          this.loadReplay(replayId);
        } else {
          this.showList();
        }
        this._bindControls();
      }

      _bindControls() {
        document.getElementById('playBtn').onclick = () => this.togglePlay();
        document.getElementById('prevBtn').onclick = () => this.stepBack();
        document.getElementById('nextBtn').onclick = () => this.stepForward();
        document.getElementById('speedSelect').onchange = (e) => {
          this.speed = parseInt(e.target.value);
          if (this.playing) { this.pause(); this.play(); }
        };
        document.getElementById('progressBar').onclick = (e) => {
          if (!this.replay) return;
          const rect = e.currentTarget.getBoundingClientRect();
          const pct = (e.clientX - rect.left) / rect.width;
          const target = Math.round(pct * this.replay.events.length);
          this.jumpTo(target);
        };
        this.speed = 1000;
      }

      showList() {
        document.getElementById('replayList').style.display = 'block';
        document.getElementById('player').classList.remove('active');
        const list = replayManager.getList();
        const container = document.getElementById('listContent');
        if (list.length === 0) {
          container.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无历史回放</p><p style="font-size:13px;">完成一局游戏后可在此查看回放</p></div>';
          return;
        }
        container.innerHTML = list.map(r => `
          <div class="replay-item" data-id="${r.id}">
            <div class="info">
              <div class="title">${r.gameType === 'doudizhu' ? '🃏 斗地主' : '🎴 掼蛋'} · ${r.result ? this._resultText(r) : '对局'}</div>
              <div class="meta">${r.date} · ${r.moveCount}步 · ${r.events.length}个事件</div>
            </div>
            <span class="badge ${r.gameType === 'doudizhu' ? 'ddz' : 'gd'}">${r.gameType === 'doudizhu' ? '斗地主' : '掼蛋'}</span>
            <span class="del" data-del="${r.id}">🗑</span>
          </div>
        `).join('');
        container.querySelectorAll('.replay-item').forEach(el => {
          el.onclick = (e) => {
            if (e.target.dataset.del) {
              e.stopPropagation();
              replayManager.remove(e.target.dataset.del);
              this.showList();
            } else {
              this.loadReplay(el.dataset.id);
            }
          };
        });
      }

      _resultText(r) {
        if (r.gameType === 'doudizhu') {
          return r.result.isLandlordWin ? '地主胜' : '农民胜';
        }
        return (r.result.winTeam === 0 ? '我方' : '对方') + '胜 升' + r.result.upLevel + '级';
      }

      loadReplay(id) {
        const data = replayManager.load(id);
        if (!data) {
          alert('回放不存在或已被删除');
          this.showList();
          return;
        }
        this.replay = data;
        this.stepIndex = -1;
        this.playing = false;
        this._initHands();
        document.getElementById('replayList').style.display = 'none';
        document.getElementById('player').classList.add('active');
        document.getElementById('gameType').textContent = data.gameType === 'doudizhu' ? '🃏 斗地主' : '🎴 掼蛋';
        document.getElementById('gameDate').textContent = data.date;
        this._renderTable();
        this._updateUI();
      }

      _initHands() {
        this.hands = this.replay.initialHands.map(
          handData => ReplayManager.deserializeCards(handData)
        );
        this.playedCards = this.hands.map(() => []);
        this.playerCount = this.hands.length;
      }

      togglePlay() {
        if (this.playing) this.pause();
        else this.play();
      }

      play() {
        if (!this.replay) return;
        if (this.stepIndex >= this.replay.events.length - 1) {
          this.stepIndex = -1;
          this._initHands();
        }
        this.playing = true;
        document.getElementById('playBtn').textContent = '⏸';
        this._scheduleNext();
      }

      pause() {
        this.playing = false;
        document.getElementById('playBtn').textContent = '▶';
        if (this.timer) { clearTimeout(this.timer); this.timer = null; }
      }

      _scheduleNext() {
        if (!this.playing) return;
        this.timer = setTimeout(() => {
          if (!this.stepForward()) {
            this.pause();
          } else {
            this._scheduleNext();
          }
        }, this.speed);
      }

      stepForward() {
        if (!this.replay || this.stepIndex >= this.replay.events.length - 1) return false;
        this.stepIndex++;
        this._applyEvent(this.replay.events[this.stepIndex]);
        this._updateUI();
        return true;
      }

      stepBack() {
        if (!this.replay || this.stepIndex <= 0) return false;
        // Rebuild from scratch to current - 1
        this.stepIndex--;
        this._initHands();
        for (let i = 0; i <= this.stepIndex; i++) {
          this._applyEvent(this.replay.events[i], true);
        }
        this._updateUI();
        return true;
      }

      jumpTo(target) {
        if (!this.replay) return;
        this.pause();
        this.stepIndex = -1;
        this._initHands();
        for (let i = 0; i < target; i++) {
          if (i < this.replay.events.length) {
            this.stepIndex = i;
            this._applyEvent(this.replay.events[i], true);
          }
        }
        this._updateUI();
      }

      _applyEvent(event, silent) {
        this.currentEvent = event;
        switch (event.type) {
          case 'deal':
            // Hands already initialized
            break;
          case 'bid':
            if (!silent) this._setActivePlayer(event.player);
            break;
          case 'play': {
            const cards = ReplayManager.deserializeCards(event.cards);
            this.playedCards[event.player] = cards;
            cards.forEach(c => {
              const idx = this.hands[event.player].findIndex(hc => hc.id === c.id);
              if (idx >= 0) this.hands[event.player].splice(idx, 1);
            });
            this._setActivePlayer(event.player);
            break;
          }
          case 'pass':
            this.playedCards[event.player] = [];
            this._setActivePlayer(event.player);
            break;
          case 'tribute':
          case 'return': {
            const cards = ReplayManager.deserializeCards(event.cards);
            cards.forEach(c => {
              const idx = this.hands[event.from].findIndex(hc => hc.id === c.id);
              if (idx >= 0) this.hands[event.from].splice(idx, 1);
            });
            cards.forEach(c => this.hands[event.to].push(c));
            break;
          }
          case 'gameover':
            this._setWinner(event);
            break;
        }
      }

      _setActivePlayer(idx) {
        this.activePlayer = idx;
        // Clear other players' played cards when a new play happens
        // (keep the current player's cards visible)
      }

      _setWinner(event) {
        if (this.replay.gameType === 'doudizhu') {
          this.winnerIdx = event.winner;
        } else {
          this.winnerTeam = event.winTeam;
        }
      }

      _renderTable() {
        const area = document.getElementById('tableArea');
        const isDdz = this.replay.gameType === 'doudizhu';
        const positions = isDdz
          ? [{ idx: 0, pos: 'bottom', name: '我' }, { idx: 1, pos: 'left', name: '电脑A' }, { idx: 2, pos: 'right', name: '电脑B' }]
          : [{ idx: 0, pos: 'bottom', name: '我(队友:对家)' }, { idx: 1, pos: 'left', name: '左家' }, { idx: 2, pos: 'top', name: '对家' }, { idx: 3, pos: 'right', name: '右家' }];

        area.innerHTML = positions.map(p => {
          const avatars = ['😎', '🤖', '🤖', '🤖'];
          return `
            <div class="seat ${p.pos}" data-seat="${p.idx}">
              <div class="seat-avatar">${avatars[p.idx]}</div>
              <div class="seat-name">${p.name}</div>
              <div class="seat-cards-count" id="count-${p.idx}">${this.hands[p.idx].length}张</div>
              <div class="played-cards" id="played-${p.idx}"></div>
            </div>
          `;
        }).join('');
      }

      _updateUI() {
        if (!this.replay) return;
        const total = this.replay.events.length;
        const current = this.stepIndex + 1;
        document.getElementById('stepInfo').textContent = `${current} / ${total}`;
        document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;

        // Update card counts and played cards
        for (let i = 0; i < this.playerCount; i++) {
          const countEl = document.getElementById('count-' + i);
          if (countEl) countEl.textContent = this.hands[i].length + '张';
          const playedEl = document.getElementById('played-' + i);
          if (playedEl) playedEl.innerHTML = this.playedCards[i].map(c => this._cardHtml(c, true)).join('');

          const seatEl = document.querySelector(`.seat[data-seat="${i}"]`);
          if (seatEl) {
            seatEl.classList.toggle('active-turn', this.activePlayer === i && this.currentEvent && this.currentEvent.type !== 'gameover');
            seatEl.classList.toggle('winner', this._isWinner(i));
          }
        }

        // Bottom hand (player 0)
        const handEl = document.getElementById('handArea');
        if (handEl) {
          handEl.innerHTML = this.hands[0].map(c => this._cardHtml(c)).join('');
        }

        // Event label
        const labelEl = document.getElementById('eventLabel');
        labelEl.textContent = this._eventLabel();
      }

      _isWinner(idx) {
        if (!this.currentEvent || this.currentEvent.type !== 'gameover') return false;
        if (this.replay.gameType === 'doudizhu') {
          if (this.currentEvent.isLandlordWin) {
            return idx === this.currentEvent.landlord;
          }
          return idx !== this.currentEvent.landlord;
        } else {
          const teams = [0, 1, 0, 1];
          return teams[idx] === this.currentEvent.winTeam;
        }
      }

      _eventLabel() {
        if (!this.currentEvent) return '点击 ▶ 开始播放';
        const e = this.currentEvent;
        const playerName = ['我', '电脑A', '对家', '右家'][e.player] || '玩家' + e.player;
        switch (e.type) {
          case 'deal': return '发牌';
          case 'bid':
            if (e.score === -1) return playerName + ' 思考中...';
            return playerName + ' 叫' + (e.score === 0 ? '不叫' : e.score + '分');
          case 'play': {
            const names = { single:'单张', pair:'对子', triple:'三张', triple_pair:'三带二',
              straight:'顺子', double_straight:'连对', triple_straight:'钢板',
              bomb:'炸弹', rocket:'王炸', straight_flush:'同花顺', sky_bomb:'天王炸' };
            return playerName + ' 出 ' + (names[e.cardType] || e.cardType || '牌');
          }
          case 'pass': return playerName + ' 不出';
          case 'tribute': return '进贡';
          case 'return': return '还贡';
          case 'level': return (e.winTeam === 0 ? '我方' : '对方') + '升' + e.upLevel + '级';
          case 'gameover':
            if (this.replay.gameType === 'doudizhu') return '游戏结束 - ' + (e.isLandlordWin ? '地主胜！' : '农民胜！');
            return '游戏结束 - ' + (e.winTeam === 0 ? '我方胜！' : '对方胜！');
          default: return '';
        }
      }

      _cardHtml(card, mini) {
        if (card.suit === 'joker') {
          const isBig = card.rank === 'BIG_JOKER';
          return `<div class="card-mini joker ${isBig ? 'red' : 'black'}">${isBig ? '大王' : '小王'}</div>`;
        }
        const isRed = card.suit === 'heart' || card.suit === 'diamond';
        const suitSymbol = { spade: '♠', heart: '♥', diamond: '♦', club: '♣' }[card.suit] || '';
        return `<div class="card-mini ${isRed ? 'red' : 'black'}">${card.display}${suitSymbol}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.replayPlayer = new ReplayPlayer();
    });
  </script>
</body>
</html>
